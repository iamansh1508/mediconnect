# Load balancer for the API copies. Docker's DNS returns one address per "api" replica and nginx
# spreads requests across all of them in turn.
# ponytail: addresses are resolved when nginx starts; restart nginx after changing the replica count.
upstream api {
  server api:5000;
}

server {
  listen 80;

  location / {
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id; # the same id appears in API and worker logs
  }

  location /socket.io/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    # Socket.io starts as HTTP and upgrades to a WebSocket; without these two headers the upgrade fails.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }
}
