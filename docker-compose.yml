# Production-like stack on one machine: nginx -> two API copies, a notification worker, MongoDB, Redis.
#   docker compose up --build -d
#   docker compose exec api node scripts/seed.js --force     (demo data)
#   open http://localhost:8080
x-env: &env
  MONGODB_URI: mongodb://mongo:27017/mediconnect
  REDIS_URL: redis://redis:6379
  ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-change-me-access-secret}
  REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-change-me-refresh-secret}
  APP_URL: http://localhost:8080
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM: ${TWILIO_FROM:-}
  SMTP_URL: ${SMTP_URL:-}

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]

  api:
    build: .
    environment: *env
    deploy: { replicas: 2 }
    depends_on: [mongo, redis]

  worker:
    build: .
    command: ["node", "src/worker.js"]
    environment: *env
    depends_on: [redis]

  mongo:
    image: mongo:7
    volumes: ["mongo-data:/data/db"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"] # keep queued notifications across restarts
    volumes: ["redis-data:/data"]

volumes:
  mongo-data:
  redis-data:
